<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gato numérico · FIME</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b2c;color:#eff5f8;font:17px system-ui}main{max-width:660px;margin:auto;padding:22px}header,nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;color:#73e8c4;border-bottom:1px solid #38506b;padding-bottom:14px}section{padding:28px 0}h1{font-size:clamp(36px,7vw,58px);margin:10px 0}button,input,select{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid #536b81}button,select{background:#22344b;color:white;cursor:pointer}button.primary{background:#73e8c4;color:#102521;font-weight:bold}button:disabled{opacity:.65;cursor:default}label{display:block;margin:16px 0}input{max-width:100%;width:180px}#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px}#board button{aspect-ratio:1;font-size:40px;font-weight:bold;background:var(--tile,#22344b);color:var(--mark,#73e8c4)}dialog{background:#18283c;color:white;max-width:min(580px,94vw);border:1px solid #4b677d;border-radius:14px;padding:24px}dialog::backdrop{background:#050c18c9}small,time{color:#73e8c4}p{line-height:1.5;white-space:pre-line}article{border-top:1px solid #42566b}button:focus-visible{outline:3px solid white}</style>
